spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clubcore_db?useSSL=false&serverTimezone=America/Argentina/Cordoba&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:clubcore_user}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    # db/seed trae usuarios/planes/clientes de demo (con contraseña pública): SOLO en dev.
    # El perfil prod no la incluye, así que una base nueva en producción queda sin usuarios.
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

n8n:
  webhook-url: ${N8N_WEBHOOK_URL:}

logging:
  level:
    com.clubcore: DEBUG
    org.springframework.security: INFO
