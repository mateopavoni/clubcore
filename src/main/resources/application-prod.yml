spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

n8n:
  webhook-url: ${N8N_WEBHOOK_URL:}

logging:
  level:
    root: WARN
    com.clubcore: INFO

# Hardening de producción: Swagger UI (con try-it-out) y /v3/api-docs exponen todo el contrato de la
# API, y /actuator/info publica el commit y el build. En prod quedan apagados salvo que se pida
# explícitamente con SWAGGER_ENABLED=true; en dev y en el compose local siguen disponibles.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
