services:
  mysql:
    image: mysql:8.4
    container_name: clubcore-mysql
    environment:
      MYSQL_DATABASE: clubcore_db
      MYSQL_USER: ${DB_USERNAME:-clubcore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - clubcore_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  clubcore_mysql_data:
    driver: local
